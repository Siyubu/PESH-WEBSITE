server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 1m;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location /api/ { proxy_pass http://backend:8000; include /etc/nginx/proxy_params_pesh; }
  location /admin/ { proxy_pass http://backend:8000; include /etc/nginx/proxy_params_pesh; }
  location /static/ { proxy_pass http://backend:8000; include /etc/nginx/proxy_params_pesh; }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri /index.html;
  }
}
